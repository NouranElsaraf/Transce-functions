name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Docs are up to date
        run: npm run docs:check
      - run: npm test
      - run: npm run build
      - name: No unpublished lessons in the production bundle
        run: node scripts/check-no-unpublished.mjs
